name: Build StudyDeck (macOS · Windows · Linux)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: dmg
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm install
      - run: npm test
      - name: Bundle local Node runtime for Pi OAuth / vision
        shell: bash
        run: |
          node -e "const fs=require('node:fs'); const p=require('node:path'); const dest=p.join('ai','runtime',process.platform==='win32'?'node.exe':'node');fs.mkdirSync(p.dirname(dest),{recursive:true});fs.copyFileSync(process.execPath,dest);if(process.platform!=='win32')fs.chmodSync(dest,0o755);console.log('Bundled Node runtime:', dest)"
          npm run build:bridge
          node --check ai/dist/bridge.mjs
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: 'StudyDeck v__VERSION__'
          releaseBody: 'Preview mit Pi OAuth + visueller PDF-Analyse. Anki Desktop und AnkiConnect werden benötigt.'
          releaseDraft: true
          prerelease: true
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studydeck-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn
